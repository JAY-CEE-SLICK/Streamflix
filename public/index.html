<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>StreamFlix Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  ::-webkit-scrollbar { display: none; }
  .active-tab { color: #e50914 !important; }
  .active-tab svg { fill: #e50914; }
</style>
</head>
<body class="bg-[#0f1014] text-white font-sans overflow-hidden">

  <div id="loginScreen" class="fixed inset-0 z-50 flex flex-col justify-center items-center bg-[#0f1014] px-8">
    <h1 class="text-4xl font-black text-[#e50914] mb-8 tracking-tighter">STREAMFLIX</h1>
    <input id="user" type="text" placeholder="Username (admin)" class="w-full max-w-xs p-4 mb-3 bg-[#1e1e24] border border-gray-700 rounded-lg text-white outline-none focus:border-[#e50914]">
    <input id="pass" type="password" placeholder="Password (123)" class="w-full max-w-xs p-4 mb-6 bg-[#1e1e24] border border-gray-700 rounded-lg text-white outline-none focus:border-[#e50914]">
    <button onclick="login()" class="w-full max-w-xs p-4 bg-[#e50914] text-white font-bold rounded-lg hover:bg-red-700 transition">Sign In</button>
  </div>

  <div id="appScreen" class="hidden h-full flex flex-col pb-20 overflow-y-auto">
    <header class="p-5 flex justify-between items-center sticky top-0 bg-gradient-to-b from-[#0f1014] to-transparent z-10">
      <div class="text-2xl font-black text-[#e50914]">STREAMFLIX</div>
      <div class="w-9 h-9 rounded bg-blue-600 flex items-center justify-center font-bold" id="profileIcon">U</div>
    </header>

    <div id="tab-home" class="px-5">
      <h2 class="text-lg font-bold mb-3">Trending Now</h2>
      <div class="flex gap-3 overflow-x-auto pb-5" id="homeList"></div>
    </div>

    <div id="tab-search" class="hidden px-5">
      <input type="text" placeholder="Search..." oninput="searchVideos(this.value)" class="w-full p-3 bg-[#1e1e24] border border-gray-700 rounded-lg text-white outline-none focus:border-[#e50914] mb-5">
      <div class="flex flex-wrap gap-3" id="searchResults"></div>
    </div>

    <div id="tab-downloads" class="hidden px-5">
      <h2 class="text-lg font-bold mb-3">Upload a Video</h2>
      <div class="bg-[#1e1e24] p-5 rounded-xl border border-gray-700">
        <input id="uploadTitle" type="text" placeholder="Video Title" class="w-full p-3 mb-3 bg-[#0f1014] border border-gray-700 rounded text-white">
        <input id="uploadFile" type="file" accept="video/mp4" class="w-full text-sm text-gray-400 mb-4 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-[#e50914] file:text-white hover:file:bg-red-700">
        <button onclick="uploadVideo()" class="w-full p-3 bg-[#e50914] text-white font-bold rounded">Upload</button>
      </div>
      <h2 class="text-lg font-bold mt-8 mb-3">My Downloads</h2>
      <div class="flex flex-wrap gap-3" id="downloadsList"></div>
    </div>

    <div id="tab-profile" class="hidden px-5 text-center mt-10">
      <div class="w-20 h-20 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-4">U</div>
      <h2 class="text-xl font-bold">User</h2>
      <p class="text-gray-400 text-sm mb-6">user@streamflix.com</p>
      <button onclick="logout()" class="px-6 py-2 border border-gray-600 rounded-full text-gray-300 hover:bg-white hover:text-black transition">Sign Out</button>
    </div>
  </div>

  <div id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-[#1e1e24]/95 backdrop-blur border-t border-gray-800 flex justify-around py-4 z-20">
    <div onclick="switchTab('home')" class="tab-btn flex flex-col items-center text-gray-400 text-xs font-bold gap-1 active-tab" id="btn-home">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home
    </div>
    <div onclick="switchTab('search')" class="tab-btn flex flex-col items-center text-gray-400 text-xs font-bold gap-1" id="btn-search">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>Search
    </div>
    <div onclick="switchTab('downloads')" class="tab-btn flex flex-col items-center text-gray-400 text-xs font-bold gap-1" id="btn-downloads">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Downloads
    </div>
    <div onclick="switchTab('profile')" class="tab-btn flex flex-col items-center text-gray-400 text-xs font-bold gap-1" id="btn-profile">
      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Profile
    </div>
  </div>

  <div id="playerOverlay" class="hidden fixed inset-0 z-50 bg-black flex-col">
    <button onclick="closePlayer()" class="absolute top-5 left-5 z-50 bg-black/50 w-10 h-10 rounded-full text-white text-xl">✕</button>
    <video id="videoPlayer" controls playsinline class="w-full h-full object-contain"></video>
  </div>

<script>
  let allVideos = [];

  async function login() {
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('bottomNav').classList.remove('hidden');
      loadVideos();
    } else {
      alert("Login Failed! Use admin / 123");
    }
  }

  function logout() { window.location.reload(); }

  function switchTab(tabName) {
    ['home', 'search', 'downloads', 'profile'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.add('hidden');
      document.getElementById(`btn-${t}`).classList.remove('active-tab');
    });
    document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    document.getElementById(`btn-${tabName}`).classList.add('active-tab');
  }

  async function loadVideos() {
    const res = await fetch('/api/videos');
    allVideos = await res.json();
    document.getElementById('homeList').innerHTML = allVideos.map(v => createCard(v)).join('');
    document.getElementById('downloadsList').innerHTML = allVideos.filter(v => v.cat === 'downloads').map(v => createCard(v)).join('');
  }

  function createCard(v) {
    return `
      <div onclick="playVideo('${v.url}')" class="min-w-[120px] h-[180px] bg-[#1e1e24] rounded-xl flex items-end p-2 relative cursor-pointer shadow-lg active:scale-95 transition">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 to-transparent rounded-xl"></div>
        <span class="relative text-xs font-bold z-10">${v.title}</span>
      </div>`;
  }

  function searchVideos(query) {
    const results = allVideos.filter(v => v.title.toLowerCase().includes(query.toLowerCase()));
    document.getElementById('searchResults').innerHTML = results.map(v => createCard(v)).join('');
  }

  async function uploadVideo() {
    const title = document.getElementById('uploadTitle').value;
    const file = document.getElementById('uploadFile').files[0];
    if (!file || !title) return alert("Select a file and add a title!");

    const formData = new FormData();
    formData.append('title', title);
    formData.append('video', file);

    alert("Uploading... Please wait.");
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.success) {
      alert("Uploaded successfully!");
      loadVideos();
      switchTab('home');
    }
  }

  function playVideo(url) {
    document.getElementById('playerOverlay').classList.remove('hidden');
    document.getElementById('playerOverlay').classList.add('flex');
    const vid = document.getElementById('videoPlayer');
    vid.src = url;
    vid.play();
  }

  function closePlayer() {
    document.getElementById('playerOverlay').classList.add('hidden');
    document.getElementById('playerOverlay').classList.remove('flex');
    const vid = document.getElementById('videoPlayer');
    vid.pause(); vid.src = "";
  }
</script>
</body>
</html>
